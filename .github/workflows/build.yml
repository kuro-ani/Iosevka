name: Build Custom Iosevka and Tune Machiko
on:
  workflow_dispatch:
    inputs:
      mono_shrink_ratio:
        required: true
        default: "0.92"
      prop_scale_x_ratio:
        required: true
        default: "0.80"
      latin_padding_width:
        required: true
        default: "60"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update && sudo apt-get install -y ttfautohint xxd
          npm install && echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          pip install fonttools
      - id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-v11-${{ hashFiles('private-build-plans.toml', 'private-build-plans-prop.toml') }}
      - run: xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
      - if: steps.cache-iosevka.outputs.cache-hit != 'true'
        run: |
          cp private-build-plans.toml private-build-plans.toml.bak
          npm run build -- 'ttf::IosevkaCustom'
          cp private-private-build-plans-prop.toml private-build-plans.toml
          npm run build -- 'ttf::IosevkaRoc'
          mv private-build-plans.toml.bak private-build-plans.toml
      - name: Create Machiko Fonts
        shell: python
        env:
          MONO_RATIO: ${{ github.event.inputs.mono_shrink_ratio }}
          PROP_RATIO: ${{ github.event.inputs.prop_scale_x_ratio }}
          LATIN_PADDING: ${{ github.event.inputs.latin_padding_width }}
        run: |
          import os, glob
          from fontTools.ttLib import TTFont
          from fontTools.ttLib.tables._n_a_m_e import NameRecord
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.pens.recordingPen import DecomposingRecordingPen
          ja_font_path = "ZenMaruGothic-Light.ttf"
          built_files = glob.glob("dist/**/*.ttf", recursive=True)
          os.makedirs("dist_machiko", exist_ok=True)
          sample_font = TTFont(built_files[0])
          base_upem = sample_font['head'].unitsPerEm
          iosevka_half_width, _ = sample_font['hmtx'].metrics.get('A', (500, 0))
          target_ja_width = int(iosevka_half_width * 5 / 3)
          sample_font.close()
          MONO_SHRINK_RATIO = float(os.environ.get("MONO_RATIO", 0.92))
          PROP_SCALE_X_RATIO = float(os.environ.get("PROP_RATIO", 0.80))
          LATIN_PADDING_EM = int(os.environ.get("LATIN_PADDING", 60))
          for ttf_path in built_files:
              if "node_modules" in ttf_path: continue
              filename = os.path.basename(ttf_path)
              if "IosevkaCustom" in filename: base_key, brand_prefix = "IosevkaCustom", "Machiko"
              elif "IosevkaRoc" in filename: base_key, brand_prefix = "IosevkaRoc", "MachikoROC"
              else: continue
              is_bold = "Bold" in filename
              style_str = "Bold" if is_bold else "Regular"
              for is_mono in [True, False]:
                  suffix = "Mono" if is_mono else "Prop"
                  brand_family = f"{brand_prefix}{suffix}"
                  machiko_path = os.path.join("dist_machiko", filename.replace(base_key, brand_family))
                  out_font = TTFont(ttf_path)
                  out_cmap = out_font['cmap'].getBestCmap()
                  out_hmtx = out_font['hmtx'].metrics
                  out_glyf = out_font['glyf']
                  out_upem = out_font['head'].unitsPerEm
                  ja_font = TTFont(ja_font_path)
                  ja_cmap = ja_font['cmap'].getBestCmap()
                  ja_hmtx = ja_font['hmtx'].metrics
                  ja_glyph_set = ja_font.getGlyphSet()
                  ja_upem = ja_font['head'].unitsPerEm
                  em_scale = out_upem / ja_upem
                  current_ratio = MONO_SHRINK_RATIO if is_mono else PROP_SCALE_X_RATIO
                  out_glyph_set = out_font.getGlyphSet()
                  for code, j_g_name in ja_cmap.items():
                      if code < 0x007F: continue
                      v_width, v_lsb = ja_hmtx[j_g_name]
                      rec_pen = DecomposingRecordingPen(ja_glyph_set)
                      ja_glyph_set[j_g_name].draw(rec_pen)
                      t_pen = TTGlyphPen(out_glyph_set)
                      trans_pen = TransformPen(t_pen, (em_scale, 0.0, 0.0, em_scale, 0.0, 0.0))
                      rec_pen.replay(trans_pen)
                      out_glyf[j_g_name] = t_pen.glyph()
                      for table in out_font['cmap'].tables: table.cmap[code] = j_g_name
                      orig_glyph = out_glyf[j_g_name]
                      if orig_glyph.numberOfContours == 0 or not hasattr(orig_glyph, 'xMin'):
                          out_hmtx[j_g_name] = (target_ja_width if is_mono else int(v_width * em_scale * current_ratio), 0)
                          continue
                      orig_x_min, orig_x_max = orig_glyph.xMin, orig_glyph.xMax
                      orig_content_width = orig_x_max - orig_x_min
                      if orig_content_width <= 0: orig_content_width, orig_x_min = int(v_width * em_scale), 0
                      if is_mono: scale_x, calc_width = (target_ja_width * current_ratio) / orig_content_width, target_ja_width
                      else: scale_x, calc_width = current_ratio, int(v_width * em_scale * current_ratio)
                      ideal_content_width = orig_content_width * scale_x
                      target_lsb = (calc_width - ideal_content_width) / 2
                      offset_x = target_lsb - (orig_x_min * scale_x)
                      if orig_glyph.isComposite():
                          for comp in orig_glyph.components: comp.x = int(comp.x * scale_x + offset_x)
                      else:
                          for i in range(len(orig_glyph.coordinates)):
                              x, y = orig_glyph.coordinates[i]
                              orig_glyph.coordinates[i] = (int(x * scale_x + offset_x), y)
                      out_hmtx[j_g_name] = (calc_width, int(target_lsb))
                  if not is_mono:
                      out_cmap_fixed = out_font['cmap'].getBestCmap()
                      for code, v_g_name in list(out_cmap_fixed.items()):
                          if 0x0020 <= code <= 0x007E:
                              final_glyph = out_glyf[v_g_name]
                              if final_glyph.numberOfContours == 0 or not hasattr(final_glyph, 'xMin'): continue
                              g_x_min, g_x_max = final_glyph.xMin, final_glyph.xMax
                              actual_char_width = g_x_max - g_x_min
                              if actual_char_width <= 0: continue
                              final_width = actual_char_width + LATIN_PADDING_EM
                              final_lsb = LATIN_PADDING_EM // 2
                              offset_latin_x = final_lsb - g_x_min
                              if final_glyph.isComposite():
                                  for comp in final_glyph.components: comp.x += int(offset_latin_x)
                              else:
                                  for i in range(len(final_glyph.coordinates)):
                                      cx, cy = final_glyph.coordinates[i]
                                      final_glyph.coordinates[i] = (cx + int(offset_latin_x), cy)
                              out_hmtx[v_g_name] = (final_width, final_lsb)
                  ja_font.close()
                  full_name = f"{brand_family} {style_str}"
                  postscript_name = f"{brand_family}-{style_str}"
                  out_font['name'].names = []
                  name_data = {1: brand_family, 2: style_str, 3: f"1.000;UKWN;{postscript_name}", 4: full_name, 6: postscript_name}
                  for nid, text_val in name_data.items():
                      for p_id, e_id, l_id, enc in [(3, 1, 0x0411, 'utf-16-be'), (3, 1, 0x0409, 'utf-16-be'), (1, 0, 0, 'ascii')]:
                          nr = NameRecord()
                          nr.platformID, nr.platEncID, nr.langID, nr.nameID = p_id, e_id, l_id, nid
                          nr.string = text_val.encode(enc, 'ignore')
                          out_font['name'].names.append(nr)
                  if 'OS/2' in out_font:
                      out_font['OS/2'].usWeightClass = 700 if is_bold else 400
                      out_font['OS/2'].ulCodePageRange1 |= 0x00020001
                      out_font['OS/2'].ulUnicodeRange1 |= 0x50000000
                      if hasattr(out_font['OS/2'], 'panose'):
                          out_font['OS/2'].panose.bFamilyType = 2
                          out_font['OS/2'].panose.bSerifStyle = 11
                          out_font['OS/2'].panose.bProportion = 3 if is_mono else 0
                  if 'post' in out_font: out_font['post'].isFixedPitch = 1 if is_mono else 0
                  if is_mono and 'hhea' in out_font: out_font['hhea'].advanceWidthMax = int(target_ja_width)
                  out_font.save(machiko_path)
                  out_font.close()
                  print(f"Generated: {machiko_path}")
      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-and-machiko-fonts
          path: |
            dist/**/*.ttf
            dist_machiko/*.ttf
          if-no-files-found: error
