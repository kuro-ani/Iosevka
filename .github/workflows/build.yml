name: Build Custom Iosevka and Tune Machiko
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      mono_shrink_ratio:
        required: true
        default: "0.92"
      prop_scale_x_ratio:
        required: true
        default: "0.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y ttfautohint xxd
          pip install fonttools
      - id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-v22-${{ hashFiles('private-build-plans.toml') }}
      - run: xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
      - if: steps.cache-iosevka.outputs.cache-hit != 'true'
        run: |
          npm install && echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          npm run build -- 'ttf::IosevkaCustom'
          npm run build -- 'ttf::IosevkaProp'
      - name: Create Machiko Fonts
        shell: python
        env:
          MONO_RATIO: ${{ github.event.inputs.mono_shrink_ratio }}
          PROP_RATIO: ${{ github.event.inputs.prop_scale_x_ratio }}
        run: |
          import os, glob
          from fontTools.ttLib import TTFont
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.pens.recordingPen import DecomposingRecordingPen
          from fontTools.ttLib.tables._h_m_t_x import table__h_m_t_x
          
          ja_f = "ZenMaruGothic-Light.ttf"
          os.makedirs("dist_machiko", exist_ok=True)
          m_r, p_r = float(os.environ["MONO_RATIO"]), float(os.environ["PROP_RATIO"])
          
          def do_merge(ttf, b_k, b_f, ratio, is_m):
              out_p = os.path.join("dist_machiko", os.path.basename(ttf).replace(b_k, b_f))
              f = TTFont(ttf); f_m = {k: v for k, v in f['hmtx'].metrics.items()}
              j = TTFont(ja_f); g_ord = list(f.getGlyphOrder()); s_y = f['head'].unitsPerEm / j['head'].unitsPerEm
              iow, _ = f['hmtx'].metrics.get('A', (500, 0))
              s_x = s_y * ((iow * 2) / 1000.0) * ratio
              c_w = int((iow * 5 / 3) * ratio) if is_m else int(1000 * s_x)
              j_cmap = j['cmap'].getBestCmap()
              
              # 0x005C(バックスラッシュ)に確実に半角円記号(0x00A5)の形状を割り当てるリスト作成
              target_items = list(j_cmap.items())
              if 0x00A5 in j_cmap:
                  target_items.append((0x005C, j_cmap[0x00A5]))
              
              for code, j_n in target_items:
                  if code < 0x007F and code != 0x005C: continue
                  is_yen = (code == 0x005C)
                  u_n = "ja_yen_005c" if is_yen else f"ja_{j_n}"
                  if u_n not in g_ord: g_ord.append(u_n)
                  v_w, _ = j['hmtx'].metrics[j_n]; orig = j['glyf'][j_n]
                  # Prop版の半角円記号は、さらにスリムな実測幅(v_w * s_x)に合わせてはみ出しを完全防止
                  glyph_w = (iow if is_m else int(v_w * s_x)) if is_yen else (c_w if is_m else int(v_w * s_x))
                  cur_sx = (s_x * 0.5) if (is_yen and is_m) else s_x
                  if orig.numberOfContours == 0 or not hasattr(orig, 'xMin'):
                      f_m[u_n] = (glyph_w, 0); f['glyf'][u_n] = orig
                      for t in f['cmap'].tables: t.cmap[code] = u_n
                      continue
                  cx = (orig.xMin + orig.xMax) / 2; ox = (glyph_w / 2) - (cx * cur_sx)
                  rec = DecomposingRecordingPen(j.getGlyphSet()); j.getGlyphSet()[j_n].draw(rec)
                  t_p = TTGlyphPen(f.getGlyphSet())
                  rec.replay(TransformPen(t_p, (cur_sx, 0.0, 0.0, s_y, ox, 0.0)))
                  f['glyf'][u_n] = t_p.glyph(); f_m[u_n] = (glyph_w, int(orig.xMin * cur_sx + ox))
                  for t in f['cmap'].tables: t.cmap[code] = u_n
                  
              f.setGlyphOrder(g_ord); new_h = table__h_m_t_x(); new_h.metrics = f_m; f['hmtx'] = new_h; j.close()
              style = "Bold" if "Bold" in ttf else "Regular"; f['name'].names = []
              for nid, txt in {1: b_f, 2: style, 3: f"1.000;UKWN;{b_f}-{style}", 4: f"{b_f} {style}", 6: f"{b_f}-{style}"}.items():
                  f['name'].setName(txt, nid, 3, 1, 0x0411); f['name'].setName(txt, nid, 3, 1, 0x0409)
              if 'OS/2' in f:
                  f['OS/2'].usWeightClass = 700 if "Bold" in ttf else 400
                  if hasattr(f['OS/2'], 'panose'): f['OS/2'].panose.bProportion = 0
                  v_w = [w for w, _ in f_m.values() if w > 0]
                  if v_w: f['OS/2'].xAvgCharWidth = int(sum(v_w) / len(v_w))
              if 'post' in f: f['post'].isFixedPitch = 0
              if 'hhea' in f:
                  f['hhea'].advanceWidthMax = max(w for w, _ in f_m.values())
                  f['hhea'].numberOfHMetrics = len(g_ord)
              f.save(out_p); f.close(); print(f"Done: {out_p}")
          
          for ttf_path in glob.glob("dist/**/*.ttf", recursive=True):
              if "node_modules" in ttf_path: continue
              if "IosevkaProp" in ttf_path: do_merge(ttf_path, "IosevkaProp", "MachikoProp", p_r, False)
              elif "IosevkaCustom" in ttf_path: do_merge(ttf_path, "IosevkaCustom", "MachikoDual", m_r, True)

      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Machiko-Fonts-Pack
          path: dist_machiko/
          if-no-files-found: error
