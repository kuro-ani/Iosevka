name: Build Custom Iosevka and Tune Machiko
on:
  workflow_dispatch:
    inputs:
      mono_shrink_ratio:
        required: true
        default: "0.92"
      prop_scale_x_ratio:
        required: true
        default: "0.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update && sudo apt-get install -y ttfautohint xxd
          npm install && echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          pip install fonttools
      - id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-v19-${{ hashFiles('private-build-plans.toml', 'private-build-plans-prop.toml') }}
      - run: xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
      - if: steps.cache-iosevka.outputs.cache-hit != 'true'
        run: |
          cp private-build-plans.toml private-build-plans.toml.bak
          npm run build -- 'ttf::IosevkaCustom'
          cp private-build-plans-prop.toml private-build-plans.toml
          npm run build -- 'ttf::IosevkaProp'
          mv private-build-plans.toml.bak private-build-plans.toml
      - name: Create Machiko Fonts
        shell: python
        env:
          MONO_RATIO: ${{ github.event.inputs.mono_shrink_ratio }}
          PROP_RATIO: ${{ github.event.inputs.prop_scale_x_ratio }}
        run: |
          import os, glob
          from fontTools.ttLib import TTFont
          from fontTools.ttLib.tables._n_a_m_e import NameRecord
          ja_font_path = "ZenMaruGothic-Light.ttf"
          built_files = glob.glob("dist/**/*.ttf", recursive=True)
          os.makedirs("dist_machiko", exist_ok=True)
          MONO_SHRINK_RATIO = float(os.environ.get("MONO_RATIO", 0.92))
          PROP_SCALE_X_RATIO = float(os.environ.get("PROP_RATIO", 0.80))
          for ttf_path in built_files:
              if "node_modules" in ttf_path: continue
              filename = os.path.basename(ttf_path)
              if "IosevkaCustom" in filename: base_key, brand_family, is_mono, current_ratio = "IosevkaCustom", "MachikoMono", True, MONO_SHRINK_RATIO
              elif "IosevkaProp" in filename: base_key, brand_family, is_mono, current_ratio = "IosevkaProp", "MachikoProp", False, PROP_SCALE_X_RATIO
              else: continue
              is_bold = "Bold" in filename
              style_str = "Bold" if is_bold else "Regular"
              machiko_path = os.path.join("dist_machiko", filename.replace(base_key, brand_family))
              
              # 解像度1000の「Zen丸ゴシック」を完全な土台（ベース）にする
              out_font = TTFont(ja_font_path)
              out_cmap = out_font['cmap'].getBestCmap()
              out_hmtx = out_font['hmtx'].metrics
              out_glyf = out_font['glyf']
              out_upem = out_font['head'].unitsPerEm
              
              # Iosevka（解像度1024）から英数字とリガチャ命令を完全同期して吸い上げる
              v_font = TTFont(ttf_path)
              v_cmap = v_font['cmap'].getBestCmap()
              v_hmtx = v_font['hmtx'].metrics
              v_glyf = v_font['glyf']
              v_upem = v_font['head'].unitsPerEm
              em_scale = out_upem / v_upem # 1000 / 1024 のスケール比率を自動算出
              
              # 日本語（全角文字）のみを対象に、指定された比率（0.80倍など）で文字幅だけを精密に長体化
              for code, g_name in list(out_cmap.items()):
                  if code < 0x007F: continue
                  v_w, v_l = out_hmtx[g_name]
                  if is_mono:
                      iosevka_half_width, _ = v_hmtx.get('A', (500, 0))
                      calc_width = int(iosevka_half_width * em_scale * 5 / 3)
                      ideal_content_width = calc_width * current_ratio
                  else:
                      calc_width = int(v_w * current_ratio)
                      ideal_content_width = (g_x_max - g_x_min) * current_ratio if (hasattr(out_glyf[g_name], 'xMin') and (g_x_max := out_glyf[g_name].xMax) and (g_x_min := out_glyf[g_name].xMin)) else calc_width
                  target_lsb = (calc_width - ideal_content_width) / 2
                  out_hmtx[g_name] = (calc_width, int(target_lsb))
              
              # Iosevkaの英数字（ASCII）および合字・リガチャ関連グリフを解像度を1000に補正して完全移植
              for v_code, v_g_name in v_cmap.items():
                  if 0x0020 <= v_code <= 0x007E:
                      ja_g_name = out_cmap.get(v_code)
                      if not ja_g_name: continue
                      out_glyf[ja_g_name] = v_glyf[v_g_name]
                      w_val, l_val = v_hmtx[v_g_name]
                      out_hmtx[ja_g_name] = (int(w_val * em_scale), int(l_val * em_scale))
              
              # リガチャに不可欠なIosevkaの電子命令および特殊合字グリフ群を丸ごとマージ
              for g_name in v_font['hmtx'].metrics.keys():
                  if g_name not in out_glyf:
                      out_glyf[g_name] = v_glyf[g_name]
                      w_val, l_val = v_hmtx[g_name]
                      out_hmtx[g_name] = (int(w_val * em_scale), int(l_val * em_scale))
              
              for table_tag in ['GSUB', 'GDEF', 'GPOS']:
                  if table_tag in v_font: out_font[table_tag] = v_font[table_tag]
              v_font.close()
              
              # メタデータおよびネーミングテーブルの刷新（Chromeブロック対策済）
              full_name = f"{brand_family} {style_str}"
              postscript_name = f"{brand_family}-{style_str}"
              uniq_id = f"1.000;UKWN;{postscript_name}"
              out_font['name'].names = []
              name_data = {1: brand_family, 2: style_str, 3: uniq_id, 4: full_name, 6: postscript_name}
              for nid, text_val in name_data.items():
                  out_font['name'].setName(text_val, nid, 3, 1, 0x0411)
                  out_font['name'].setName(text_val, nid, 3, 1, 0x0409)
                  out_font['name'].setName(text_val, nid, 1, 0, 0)
              if 'OS/2' in out_font:
                  out_font['OS/2'].usWeightClass = 700 if is_bold else 400
                  out_font['OS/2'].ulCodePageRange1 |= 0x00020001
                  out_font['OS/2'].ulUnicodeRange1 |= 0x50000000
                  if hasattr(out_font['OS/2'], 'panose'):
                      out_font['OS/2'].panose.bFamilyType = 2
                      out_font['OS/2'].panose.bSerifStyle = 11
                      out_font['OS/2'].panose.bProportion = 3 if is_mono else 0
              if 'post' in out_font: out_font['post'].isFixedPitch = 1 if is_mono else 0
              if is_mono and 'hhea' in out_font:
                  iosevka_half_width, _ = v_hmtx.get('A', (500, 0))
                  out_font['hhea'].advanceWidthMax = int(iosevka_half_width * em_scale * 5 / 3)
              out_font.save(machiko_path)
              out_font.close()
              print(f"Successfully generated: {machiko_path}")
      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-and-machiko-fonts
          path: |
            dist/**/*.ttf
            dist_machiko/*.ttf
          if-no-files-found: error
