name: Build Custom Iosevka and Tune Machiko
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      mono_shrink_ratio:
        required: true
        default: "0.92"
      prop_scale_x_ratio:
        required: true
        default: "0.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y ttfautohint xxd fontforge python3-fontforge
          pip install fonttools
      - id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-v22-${{ hashFiles('private-build-plans.toml') }}
      - run: xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
      - if: steps.cache-iosevka.outputs.cache-hit != 'true'
        run: |
          npm install && echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          npm run build -- 'ttf::IosevkaCustom'
          npm run build -- 'ttf::IosevkaProp'
      - name: Create Machiko Fonts
        shell: python
        env:
          MONO_RATIO: ${{ github.event.inputs.mono_shrink_ratio }}
          PROP_RATIO: ${{ github.event.inputs.prop_scale_x_ratio }}
        run: |
          import os, glob, fontforge, psMat
          from fontTools.ttLib import TTFont
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.pens.recordingPen import DecomposingRecordingPen
          from fontTools.ttLib.tables._h_m_t_x import table__h_m_t_x
          
          ja_f = "ZenMaruGothic-Light.ttf"
          os.makedirs("dist_machiko", exist_ok=True)
          m_r = float(os.environ.get("MONO_RATIO", 0.92))
          p_r = float(os.environ.get("PROP_RATIO", 0.80))
          
          for ttf_path in glob.glob("dist/**/*.ttf", recursive=True):
              if "node_modules" in ttf_path: continue
              filename = os.path.basename(ttf_path)
              
              if "IosevkaProp" in filename:
                  base_key, brand_family, is_mono, user_ratio = "IosevkaProp", "MachikoProp", False, p_r
                  style_str = "Bold" if "Bold" in filename else "Regular"
                  machiko_path = os.path.join("dist_machiko", filename.replace(base_key, brand_family))
                  f_f = TTFont(ttf_path); f_m = {k: v for k, v in f_f['hmtx'].metrics.items()}
                  j_f = TTFont(ja_f); g_ord = list(f_f.getGlyphOrder())
                  iow = f_f['hmtx'].metrics.get('A', (500, 0))
                  scale_x = (f_f['head'].unitsPerEm / j_f['head'].unitsPerEm) * ((iow * 2) / 1000.0) * user_ratio
                  
                  for code, j_name in j_f['cmap'].getBestCmap().items():
                      if code < 0x007F: continue
                      u_name = f"ja_{j_name}"
                      if u_name not in g_ord: g_ord.append(u_name)
                      v_w, v_l = j_f['hmtx'].metrics[j_name]; orig = j_f['glyf'][j_name]; c_w = int(v_w * scale_x)
                      if orig.numberOfContours == 0 or not hasattr(orig, 'xMin'):
                          f_m[u_name] = (c_w, 0); f_f['glyf'][u_name] = orig
                          for t in f_f['cmap'].tables: t.cmap[code] = u_name
                          continue
                      ox = (c_w / 2) - (((orig.xMin + orig.xMax) / 2) * scale_x)
                      rec = DecomposingRecordingPen(j_f.getGlyphSet()); j_f.getGlyphSet()[j_name].draw(rec)
                      t_p = TTGlyphPen(f_f.getGlyphSet())
                      rec.replay(TransformPen(t_p, (scale_x, 0.0, 0.0, f_f['head'].unitsPerEm / j_f['head'].unitsPerEm, ox, 0.0)))
                      f_f['glyf'][u_name] = t_p.glyph(); f_m[u_name] = (c_w, int(orig.xMin * scale_x + ox))
                      for t in f_f['cmap'].tables: t.cmap[code] = u_name
                      
                  f_f.setGlyphOrder(g_ord); new_h = table__h_m_t_x(); new_h.metrics = f_m; f_f['hmtx'] = new_h; j_f.close()
                  style = "Bold" if "Bold" in filename else "Regular"
                  f_f['name'].names = []
                  for nid, txt in {1: brand_family, 2: style, 3: f"1.000;UKWN;{brand_family}-{style}", 4: f"{brand_family} {style}", 6: f"{brand_family}-{style}"}.items():
                      f_f['name'].setName(txt, nid, 3, 1, 0x0411); f_f['name'].setName(txt, nid, 3, 1, 0x0409)
                  if 'OS/2' in f_f:
                      f_f['OS/2'].usWeightClass = 700 if style == "Bold" else 400
                      f_f['OS/2'].ulCodePageRange1 |= 0x00020001; f_f['OS/2'].ulUnicodeRange1 |= 0x50000000
                      if hasattr(f_f['OS/2'], 'panose'): f_f['OS/2'].panose.bFamilyType = 2; f_f['OS/2'].panose.bSerifStyle = 11; f_f['OS/2'].panose.bProportion = 0
                      v_w = [w for w, _ in f_m.values() if w > 0]
                      if v_w: f_f['OS/2'].xAvgCharWidth = int(sum(v_w) / len(v_w))
                  if 'post' in f_f: f_f['post'].isFixedPitch = 0
                  f_f.save(machiko_path); f_f.close()
                  print(f"Prop Generated: {machiko_path}")
                  continue
                  
              elif "IosevkaCustom" in filename:
                  base_key, brand_family, is_mono, user_ratio = "IosevkaCustom", "MachikoMono", True, m_r
                  style_str = "Bold" if "Bold" in filename else "Regular"
                  machiko_path = os.path.join("dist_machiko", filename.replace(base_key, brand_family))
                  b_ff = fontforge.open(ttf_path)
                  b_ff.mergeFonts(ja_f)
                  b_ff.selection.select('A')
                  for g in b_ff.selection.byGlyphs: iow = g.width; break
                  t_w = int(iow * 5 / 3)
                  
                  sx = (t_w / (iow * 2)) * (5 / 6) * user_ratio
                  mat = psMat.scale(sx, float(b_ff.em) / 1000.0)
                  
                  b_ff.selection.all()
                  for g in b_ff.selection.byGlyphs:
                      code = g.unicode
                      if code < 0x007F or code == -1: continue
                      g.transform(mat); g.width = t_w
                      bbox = g.boundingBox()
                      if (bbox[2] - bbox[0]) > 0:
                          g.transform(psMat.translate((t_w / 2) - ((bbox[0] + bbox[2]) / 2), 0))
                          g.width = t_w
                          
                  style = "Bold" if "Bold" in filename else "Regular"
                  b_ff.familyname = brand_family; b_ff.fontname = f"{brand_family}-{style}"; b_ff.fullname = f"{brand_family} {style}"
                  b_ff.generate(machiko_path, flags=('opentype', 'round'))
                  b_ff.close()
                  
                  fix_f = TTFont(machiko_path); final_mono_metrics = {}
                  for k, v in fix_f['hmtx'].metrics.items():
                      if k.startswith('ja_'):
                          final_mono_metrics[k] = (t_w, v)
                      else:
                          final_mono_metrics[k] = v
                  fix_f['hmtx'].metrics = final_mono_metrics
                  if 'post' in fix_f: fix_f['post'].isFixedPitch = 1
                  if 'OS/2' in fix_f and hasattr(fix_f['OS/2'], 'panose'): fix_f['OS/2'].panose.bProportion = 3
                  if 'hhea' in fix_f:
                      fix_f['hhea'].advanceWidthMax = t_w
                      fix_f['hhea'].numberOfHMetrics = len(fix_f.getGlyphOrder())
                  fix_f.save(machiko_path); fix_f.close()
                  print(f"Mono Generated: {machiko_path}")

      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Machiko-Fonts-Pack
          path: dist_machiko/
          if-no-files-found: error
