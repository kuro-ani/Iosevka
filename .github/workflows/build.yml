name: Build Custom Iosevka and Tune Machiko
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      mono_shrink_ratio:
        required: true
        default: "0.92"
      prop_scale_x_ratio:
        required: true
        default: "0.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y ttfautohint xxd fontforge python3-fontforge
          pip install fonttools
      - id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-v22-${{ hashFiles('private-build-plans.toml') }}
      - run: xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
      - if: steps.cache-iosevka.outputs.cache-hit != 'true'
        run: |
          npm install && echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          npm run build -- 'ttf::IosevkaCustom'
          npm run build -- 'ttf::IosevkaProp'
      - name: Create Machiko Fonts
        shell: python
        env:
          MONO_RATIO: ${{ github.event.inputs.mono_shrink_ratio }}
          PROP_RATIO: ${{ github.event.inputs.prop_scale_x_ratio }}
        run: |
          import os, glob, fontforge, psMat
          from fontTools.ttLib import TTFont
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.pens.recordingPen import DecomposingRecordingPen
          from fontTools.ttLib.tables._h_m_t_x import table__h_m_t_x
          
          ja_f = "ZenMaruGothic-Light.ttf"
          os.makedirs("dist_machiko", exist_ok=True)
          m_r, p_r = float(os.environ["MONO_RATIO"]), float(os.environ["PROP_RATIO"])
          
          for ttf in glob.glob("dist/**/*.ttf", recursive=True):
              if "node_modules" in ttf: continue
              fn = os.path.basename(ttf)
              
              if "IosevkaProp" in fn:
                  b_k, b_f, ratio = "IosevkaProp", "MachikoProp", p_r
                  out_p = os.path.join("dist_machiko", fn.replace(b_k, b_f))
                  f_f = TTFont(ttf)
                  f_m = {k: v for k, v in f_f['hmtx'].metrics.items()}
                  j_f = TTFont(ja_f)
                  j_c = j_f['cmap'].getBestCmap()
                  scale_x = (f_f['head'].unitsPerEm / j_f['head'].unitsPerEm) * ((f_f['hmtx'].metrics.get('A', (500, 0))[0] * 2) / 1000.0) * ratio
                  g_ord = list(f_f.getGlyphOrder())
                  
                  for code, j_name in j_c.items():
                      if code < 0x007F: continue
                      u_name = f"ja_{j_name}"
                      if u_name not in g_ord: g_ord.append(u_name)
                      v_w, v_l = j_f['hmtx'].metrics[j_name]
                      orig = j_f['glyf'][j_name]
                      c_w = int(v_w * scale_x)
                      if orig.numberOfContours == 0 or not hasattr(orig, 'xMin'):
                          f_m[u_name] = (c_w, 0)
                          f_f['glyf'][u_name] = orig
                          for t in f_f['cmap'].tables: t.cmap[code] = u_name
                          continue
                      cx = (orig.xMin + orig.xMax) / 2
                      ox = (c_w / 2) - (cx * scale_x)
                      lsb = int(orig.xMin * scale_x + ox)
                      rec = DecomposingRecordingPen(j_f.getGlyphSet())
                      j_f.getGlyphSet()[j_name].draw(rec)
                      t_p = TTGlyphPen(f_f.getGlyphSet())
                      rec.replay(TransformPen(t_p, (scale_x, 0.0, 0.0, f_f['head'].unitsPerEm / j_f['head'].unitsPerEm, ox, 0.0)))
                      f_f['glyf'][u_name] = t_p.glyph()
                      f_m[u_name] = (c_w, lsb)
                      for t in f_f['cmap'].tables: t.cmap[code] = u_name
                      
                  f_f.setGlyphOrder(g_ord)
                  f_f['hmtx'].metrics = f_m
                  j_f.close()
                  style = "Bold" if "Bold" in fn else "Regular"
                  f_f['name'].names = []
                  for nid, txt in {1: b_f, 2: style, 3: f"1.000;UKWN;{b_f}-{style}", 4: f"{b_f} {style}", 6: f"{b_f}-{style}"}.items():
                      f_f['name'].setName(txt, nid, 3, 1, 0x0411)
                      f_f['name'].setName(txt, nid, 3, 1, 0x0409)
                  if 'OS/2' in f_f:
                      f_f['OS/2'].usWeightClass = 700 if "Bold" in fn else 400
                      if hasattr(f_f['OS/2'], 'panose'): f_f['OS/2'].panose.bProportion = 0
                      v_w = [w for w, _ in f_m.values() if w > 0]
                      if v_w: f_f['OS/2'].xAvgCharWidth = int(sum(v_w) / len(v_w))
                  if 'post' in f_f: f_f['post'].isFixedPitch = 0
                  f_f.save(out_p)
                  f_f.close()
                  
              elif "IosevkaCustom" in fn:
                  b_f, ratio = "MachikoMono", m_r
                  out_p = os.path.join("dist_machiko", fn.replace("IosevkaCustom", b_f))
                  b_ff, j_ff = fontforge.open(ttf), fontforge.open(ja_f)
                  b_ff.selection.select('A')
                  for g in b_ff.selection.byGlyphs: iow = g.width; break
                  t_w = int(iow * 5 / 3)
                  sx = (t_w / (iow * 2)) * (5 / 6) * ratio
                  mat = psMat.scale(sx, float(b_ff.os2_em) / float(j_ff.os2_em))
                  j_ff.selection.all()
                  for j_g in j_ff.selection.byGlyphs:
                      code = j_g.unicode
                      if code < 0x007F or code == -1: continue
                      j_g.transform(mat)
                      j_g.width = t_w
                      bbox = j_g.boundingBox()
                      if (bbox[2] - bbox[0]) > 0:
                          j_g.transform(psMat.translate((t_w / 2) - ((bbox[0] + bbox[2]) / 2), 0))
                          j_g.width = t_w
                      b_ff.createChar(code, f"ja_{j_g.glyphname}")
                      b_ff[code].layers = j_g.layers
                      b_ff[code].width = t_w
                  style = "Bold" if "Bold" in fn else "Regular"
                  b_ff.familyname = b_f
                  b_ff.fontname = f"{b_f}-{style}"
                  b_ff.fullname = f"{b_f} {style}"
                  b_ff.generate(out_p, flags=('opentype', 'round'))
                  b_ff.close()
                  j_ff.close()

      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Machiko-Fonts-Pack
          path: dist_machiko/
          if-no-files-found: error
