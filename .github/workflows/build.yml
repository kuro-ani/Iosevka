name: Build Custom Iosevka and Tune Machiko
on:
  workflow_dispatch:
    inputs:
      shrink_ratio:
        description: "Glyph Shrink Ratio (e.g., 0.92)"
        required: true
        default: "0.92"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint xxd
          npm install
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          pip install fonttools

      # --- 【高速化】Iosevkaのビルド結果をまるごとキャッシュ ---
      - name: Cache Iosevka Build Outputs
        id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-base-dist-${{ hashFiles('private-build-plans.toml') }}

      # 16進数テキストから本物フォントを完全復元（1秒未満）
      - name: Restore Zen Maru Gothic from Local Hex Text
        run: |
          xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
          echo "Successfully restored base font from hex text safely."

      # 【条件付き実行】TOMLに変更がない限り、自動スキップ
      - name: Build Base Font
        if: steps.cache-iosevka.outputs.cache-hit != 'true'
        env:
          IOSEVKA_CUSTOM_PLAN_PATH: private-build-plans.toml
        run: npm run build -- 'ttf::IosevkaCustom'

      # IME確定前「■」現象対策・統計値完全同期版マージ処理
      - name: Create Machiko Font (Merge and Re-scale to 3:5)
        shell: python
        env:
          RATIO: ${{ github.event.inputs.shrink_ratio }}
        run: |
          import os
          import glob
          from fontTools.ttLib import TTFont
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen

          ja_font_path = "ZenMaruGothic-Light.ttf"
          if not os.path.exists(ja_font_path):
              raise FileNotFoundError(f"Base font '{ja_font_path}' not found.")

          built_files = glob.glob("dist/**/*.ttf", recursive=True)
          if not built_files:
              raise FileNotFoundError("No built Iosevka fonts found in dist/ directory.")

          os.makedirs("dist_machiko", exist_ok=True)

          # --- 基準値の取得 ---
          sample_font = TTFont(built_files[0])
          base_upem = sample_font['head'].unitsPerEm
          iosevka_half_width, _ = sample_font['hmtx'].metrics.get('A', (500, 0))
          target_ja_width = int(iosevka_half_width * 5 / 3)
          sample_font.close()

          print("Extracting Zen Maru Gothic glyph geometry metadata...")
          ja_font = TTFont(ja_font_path)
          ja_cmap = ja_font['cmap'].getBestCmap()
          ja_hmtx = ja_font['hmtx'].metrics
          ja_upem = ja_font['head'].unitsPerEm

          GLYPH_SHRINK_RATIO = float(os.environ.get("RATIO", 0.92))
          print(f"Applying GLYPH_SHRINK_RATIO: {GLYPH_SHRINK_RATIO}")

          # --- 【最適化】重い変形パラメータの計算を1回のみ先行処理 ---
          ja_transform_plans = {}
          em_scale = base_upem / ja_upem

          for code, glyph_name in ja_cmap.items():
              orig_ja_width, _ = ja_hmtx.get(glyph_name, (ja_upem, 0))
              orig_glyph = ja_font['glyf'][glyph_name]
              
              if orig_glyph.numberOfContours == 0:
                  ja_transform_plans[code] = {
                      'glyph_name': glyph_name,
                      'is_empty': True,
                      'target_width': target_ja_width,
                      'target_lsb': 0,
                      'params': None
                  }
                  continue
                  
              orig_x_min = orig_glyph.xMin
              orig_x_max = orig_glyph.xMax
              orig_content_width = orig_x_max - orig_x_min
              
              if orig_content_width <= 0:
                  orig_content_width = orig_ja_width
                  orig_x_min = 0
              
              ideal_content_width = target_ja_width * GLYPH_SHRINK_RATIO
              scale_x = (ideal_content_width / orig_content_width) * em_scale
              scale_y = em_scale
              
              target_lsb = (target_ja_width - ideal_content_width) / 2
              offset_x = target_lsb - (orig_x_min * scale_x)
              
              ja_transform_plans[code] = {
                  'glyph_name': glyph_name,
                  'is_empty': False,
                  'target_width': target_ja_width,
                  'target_lsb': int(target_lsb),
                  'params': (scale_x, 0.0, 0.0, scale_y, offset_x, 0.0)
              }

          print("Calculated transformation matrices for Japanese glyphs.")

          # --- 各Iosevkaフォントへ安全に流し込み ＆ メタデータ再計算 ---
          for ttf_path in built_files:
              if "node_modules" in ttf_path:
                  continue
              filename = os.path.basename(ttf_path)
              machiko_path = os.path.join("dist_machiko", filename.replace("IosevkaCustom", "Machiko"))
              print(f"Generating optimized Machiko font with IME fix: {machiko_path}")
              
              base_font = TTFont(ttf_path)
              base_cmap = base_font['cmap'].getBestCmap()
              base_hmtx = base_font['hmtx'].metrics
              base_glyph_set = base_font.getGlyphSet()
              glyf_table = base_font['glyf']
              
              for code, plan in ja_transform_plans.items():
                  if code not in base_cmap:
                      glyph_name = plan['glyph_name']
                      
                      if plan['is_empty']:
                          if glyph_name not in glyf_table:
                              glyf_table[glyph_name] = ja_font['glyf'][glyph_name]
                          base_cmap[code] = glyph_name
                          base_hmtx[glyph_name] = (plan['target_width'], 0)
                          continue
                      
                      t_pen = TTGlyphPen(base_glyph_set)
                      trans_pen = TransformPen(t_pen, plan['params'])
                      ja_font['glyf'][glyph_name].draw(trans_pen, ja_font['glyf'])
                      
                      glyf_table[glyph_name] = t_pen.glyph()
                      base_cmap[code] = glyph_name
                      base_hmtx[glyph_name] = (plan['target_width'], plan['target_lsb'])
              
              # --- 【IME対策：最重要】全グリフを走査しフォント全体の境界ボックスの統計値を完全同期 ---
              x_min_all, y_min_all = 32767, 32767
              x_max_all, y_max_all = -32768, -32768
              
              for g_name in glyf_table.keys():
                  g = glyf_table[g_name]
                  if g.numberOfContours > 0:
                      if g.xMin < x_min_all: x_min_all = g.xMin
                      if g.yMin < y_min_all: y_min_all = g.yMin
                      if g.xMax > x_max_all: x_max_all = g.xMax
                      if g.yMax > y_max_all: y_max_all = g.yMax

              # head テーブルの更新
              base_font['head'].xMin = x_min_all
              base_font['head'].yMin = y_min_all
              base_font['head'].xMax = x_max_all
              base_font['head'].yMax = y_max_all

              # OS/2 テーブルの統計値を厳格に更新
              if 'OS/2' in base_font:
                  base_font['OS/2'].xAvgCharWidth = int(target_ja_width) # 平均幅を全角基準に安全同期
                  # Windows IMEのレンダリング制限を解除するためのウエイト（Regular=400, Bold=700）の保護確認
                  # 境界ボックスの同期
                  base_font['OS/2'].usFirstCharIndex = min(base_cmap.keys())
                  base_font['OS/2'].usLastCharIndex = max(base_cmap.keys())

              # hhea テーブルの更新
              if 'hhea' in base_font:
                  base_font['hhea'].advanceWidthMax = max([w for w, _ in base_hmtx.values()])
                  base_font['hhea'].minLeftSideBearing = min([l for _, l in base_hmtx.values()])
                  base_font['hhea'].minRightSideBearing = min([w - (glyf_table[n].xMax if n in glyf_table and glyf_table[n].numberOfContours > 0 else w) for n, (w, _) in base_hmtx.items()])
                  base_font['hhea'].xMaxExtent = x_max_all

              # メタデータ名（名前ID）の一括置換
              target_name_ids = (1, 3, 4, 6, 16, 17)
              for name_record in base_font['name'].names:
                  if name_record.nameID in target_name_ids:
                      text = name_record.toUnicode()
                      text = text.replace("Iosevka Custom", "Machiko").replace("IosevkaCustom", "Machiko")
                      name_record.string = text.encode('utf-16-be')
                      
              base_font.save(machiko_path)
              base_font.close()

          ja_font.close()
          print("All Machiko fonts generated completely with IME fix patches.")

      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-and-machiko-fonts
          path: |
            dist/**/*.ttf
            dist_machiko/*.ttf
          if-no-files-found: error
