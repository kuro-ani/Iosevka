name: Build Custom Iosevka
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint
          npm install
          pip install fonttools

      - name: Build Base Font
        env:
          IOSEVKA_CUSTOM_PLAN_PATH: private-build-plans.toml
        run: npm run build -- 'ttf::IosevkaCustom'

      - name: Create Machiko Font (Merge and Re-scale to 3:5)
        shell: python
        run: |
          import os
          import glob
          from fontTools.ttLib import TTFont
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen

          ja_font_path = "ZenMaruGothic-Light.ttf"
          if not os.path.exists(ja_font_path):
              raise FileNotFoundError(f"Base font '{ja_font_path}' not found in repository root.")

          built_files = glob.glob("dist/**/*.ttf", recursive=True)
          if not built_files:
              raise FileNotFoundError("No built Iosevka fonts found in dist/ directory.")
          
          os.makedirs("dist_machiko", exist_ok=True)

          for ttf_path in built_files:
              if "node_modules" in ttf_path:
                  continue

              filename = os.path.basename(ttf_path)
              machiko_path = os.path.join("dist_machiko", filename.replace("IosevkaCustom", "Machiko"))
              
              print(f"Processing 3:5 scale merge: {machiko_path}")
              
              base_font = TTFont(ttf_path)
              ja_font = TTFont(ja_font_path)

              base_cmap = base_font['cmap'].getBestCmap()
              ja_cmap = ja_font['cmap'].getBestCmap()
              base_hmtx = base_font['hmtx'].metrics
              ja_hmtx = ja_font['hmtx'].metrics

              # 1. Iosevkaの半角英数 'A' の横幅を基準として取得
              iosevka_half_width, _ = base_hmtx.get('A', (500, 0))
              
              # 2. 3:5の比率を維持するため、日本語（全角）のあるべきターゲット横幅を計算
              target_ja_width = int(iosevka_half_width * 5 / 3)
              print(f"  Iosevka half width: {iosevka_half_width} -> Target Japanese width: {target_ja_width}")

              # 3. 縦横のEMサイズの違いを吸収する倍率を計算
              base_upem = base_font['head'].unitsPerEm
              ja_upem = ja_font['head'].unitsPerEm
              em_scale = base_upem / ja_upem

              # 4. グリフセットとペンオブジェクトの用意
              base_glyph_set = base_font.getGlyphSet()
              ja_glyph_set = ja_font.getGlyphSet()

              # 5. 日本語グリフを横方向のみ縮小（長体化）して注入
              for code, glyph_name in ja_cmap.items():
                  if code not in base_cmap:
                      # 元の日本語文字の幅を取得
                      orig_ja_width, _ = ja_hmtx.get(glyph_name, (ja_upem, 0))
                      
                      # 横方向の正確な長体化スケール（3:5用）を算出
                      scale_x = target_ja_width / (orig_ja_width * em_scale)
                      scale_y = em_scale

                      # 実在するペンツールを使って、座標をアフィン変換で縮小変形
                      t_pen = TTGlyphPen(base_glyph_set)
                      trans_pen = TransformPen(t_pen, (scale_x, 0.0, 0.0, scale_y, 0.0, 0.0))
                      
                      ja_glyph_set[glyph_name].draw(trans_pen)
                      transformed_glyph = t_pen.glyph()

                      # Iosevka側に変形済みの形と、3:5にリサイズした文字幅データを登録
                      base_font['glyf'][glyph_name] = transformed_glyph
                      base_cmap[code] = glyph_name
                      base_hmtx[glyph_name] = (target_ja_width, 0)

              # 6. フォントファミリーのメタデータを「Machiko」に完全書き換え
              target_name_ids = (1, 3, 4, 6, 16, 17)
              for name_record in base_font['name'].names:
                  if name_record.nameId in target_name_ids:
                      text = name_record.toUnicode()
                      text = text.replace("Iosevka Custom", "Machiko")
                      text = text.replace("IosevkaCustom", "Machiko")
                      name_record.string = text.encode('utf-16-be')

              base_font.save(machiko_path)
          print("All Machiko fonts generated successfully with 3:5 layout.")

      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-and-machiko-fonts
          path: |
            dist/**/*.ttf
            dist_machiko/*.ttf
          if-no-files-found: error
