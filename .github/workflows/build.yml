name: Build Custom Iosevka and Tune Machiko
on:
  workflow_dispatch:
    inputs:
      shrink_ratio:
        description: "Glyph Shrink Ratio (e.g., 0.92)"
        required: true
        default: "0.92"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint xxd
          npm install
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          pip install fonttools

      # --- 【高速化】Iosevkaのビルド結果をまるごとキャッシュ ---
      - name: Cache Iosevka Build Outputs
        id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-base-dist-${{ hashFiles('private-build-plans.toml') }}

      # 16進数テキストから本物フォントを完全復元
      - name: Restore Zen Maru Gothic from Local Hex Text
        run: |
          xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
          echo "Successfully restored base font from hex text safely."

      # 【条件付き実行】TOMLに変更がない限り自動スキップ
      - name: Build Base Font
        if: steps.cache-iosevka.outputs.cache-hit != 'true'
        env:
          IOSEVKA_CUSTOM_PLAN_PATH: private-build-plans.toml
        run: npm run build -- 'ttf::IosevkaCustom'

      # 完全クレンジング型・IME候補窓豆腐絶対修正版マージ処理
      - name: Create Machiko Font (Merge and Re-scale to 3:5)
        shell: python
        env:
          RATIO: ${{ github.event.inputs.shrink_ratio }}
        run: |
          import os
          import glob
          from fontTools.ttLib import TTFont
          from fontTools.ttLib.tables._n_a_m_e import NameRecord
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.pens.recordingPen import DecomposingRecordingPen

          ja_font_path = "ZenMaruGothic-Light.ttf"
          if not os.path.exists(ja_font_path):
              raise FileNotFoundError(f"Base font '{ja_font_path}' not found.")

          built_files = glob.glob("dist/**/*.ttf", recursive=True)
          if not built_files:
              raise FileNotFoundError("No built Iosevka fonts found in dist/ directory.")

          os.makedirs("dist_machiko", exist_ok=True)

          # --- 基準値の取得（リストの最初の要素を参照するように確実に修正） ---
          sample_font = TTFont(built_files[0])
          base_upem = sample_font['head'].unitsPerEm
          iosevka_half_width, _ = sample_font['hmtx'].metrics.get('A', (500, 0))
          target_ja_width = int(iosevka_half_width * 5 / 3)
          sample_font.close()

          GLYPH_SHRINK_RATIO = float(os.environ.get("RATIO", 0.92))
          print(f"Applying GLYPH_SHRINK_RATIO: {GLYPH_SHRINK_RATIO}")

          for ttf_path in built_files:
              if "node_modules" in ttf_path:
                  continue
              filename = os.path.basename(ttf_path)
              machiko_path = os.path.join("dist_machiko", filename.replace("IosevkaCustom", "Machiko"))
              print(f"Generating Machiko via True Decomposing Pipeline: {machiko_path}")
              
              # 日本語フォント（Zen丸ゴシック）を「土台」にする
              out_font = TTFont(ja_font_path)
              out_cmap = out_font['cmap'].getBestCmap()
              out_hmtx = out_font['hmtx'].metrics
              out_glyf = out_font['glyf']
              out_upem = out_font['head'].unitsPerEm
              
              # Iosevkaフォントの読み込み
              v_font = TTFont(ttf_path)
              v_cmap = v_font['cmap'].getBestCmap()
              v_hmtx = v_font['hmtx'].metrics
              v_glyph_set = v_font.getGlyphSet()
              
              em_scale = out_upem / base_upem
              
              # ステップ1: コンポーネントを壊さずに日本語グリフデータのみを直接座標変換
              print("Transforming core Japanese glyphs via direct coordinate math...")
              for code, g_name in list(out_cmap.items()):
                  if code < 0x7F:
                      continue
                      
                  orig_glyph = out_glyf[g_name]
                  if orig_glyph.numberOfContours == 0:
                      out_hmtx[g_name] = (target_ja_width, 0)
                      continue
                  
                  orig_x_min = orig_glyph.xMin
                  orig_x_max = orig_glyph.xMax
                  orig_content_width = orig_x_max - orig_x_min
                  
                  if orig_content_width <= 0:
                      orig_content_width = out_hmtx[g_name]
                      orig_x_min = 0
                      
                  ideal_content_width = target_ja_width * GLYPH_SHRINK_RATIO
                  scale_x = ideal_content_width / orig_content_width
                  target_lsb = (target_ja_width - ideal_content_width) / 2
                  offset_x = target_lsb - (orig_x_min * scale_x)
                  
                  if orig_glyph.isComposite():
                      for comp in orig_glyph.components:
                          comp.x = int(comp.x * scale_x + offset_x)
                  else:
                      for i in range(len(orig_glyph.coordinates)):
                          x, y = orig_glyph.coordinates[i]
                          new_x = int(x * scale_x + offset_x)
                          orig_glyph.coordinates[i] = (new_x, y)
                  
                  out_hmtx[g_name] = (target_ja_width, int(target_lsb))
                  
              # ステップ2: Iosevkaの半角英数字（ASCII 0x0020 - 0x007E）のみ精密移植
              print("Injecting Decomposed Iosevka Latin glyphs...")
              out_glyph_set = out_font.getGlyphSet()
              
              for code, v_g_name in v_cmap.items():
                  if 0x0020 <= code <= 0x007E:
                      ja_g_name = out_cmap.get(code)
                      if not ja_g_name:
                          continue
                          
                      v_width, v_lsb = v_hmtx[v_g_name]
                      
                      rec_pen = DecomposingRecordingPen(v_glyph_set)
                      v_glyph_set[v_g_name].draw(rec_pen)
                      
                      t_pen = TTGlyphPen(out_glyph_set)
                      trans_pen = TransformPen(t_pen, (em_scale, 0.0, 0.0, em_scale, 0.0, 0.0))
                      rec_pen.replay(trans_pen)
                      
                      out_glyf[ja_g_name] = t_pen.glyph()
                      out_hmtx[ja_g_name] = (int(v_width * em_scale), int(v_lsb * em_scale))
                      
              v_font.close()
              
              # ステップ3: 【IME候補窓絶対修正】nameテーブルを完全にクレンジングして再構築
              is_bold = "Bold" in filename
              style_str = "Bold" if is_bold else "Regular"
              full_name = f"Machiko {style_str}"
              postscript_name = f"Machiko-{style_str}"
              
              out_font['name'].names = []
              
              name_configs = [
                  (0x0409, "Machiko", style_str, full_name, postscript_name),
                  (0x0411, "Machiko", style_str, full_name, postscript_name)
              ]
              
              for lang_id, fam, styl, f_nm, ps_nm in name_configs:
                  name_data = {
                      1: fam,             # Font Family Name
                      2: styl,            # Font Subfamily Name
                      3: f"1.000;UKWN;{ps_nm}", # Unique Font ID
                      4: f_nm,            # Full Font Name
                      6: ps_nm,           # PostScript Name
                  }
                  for name_id, text_val in name_data.items():
                      nr = NameRecord()
                      nr.platformID = 3
                      nr.platEncID = 1
                      nr.langID = lang_id
                      nr.nameID = name_id
                      nr.string = text_val.encode('utf-16-be')
                      out_font['name'].names.append(nr)
                      
              # メタデータおよびビットフラグの強制同期
              if 'OS/2' in out_font:
                  out_font['OS/2'].usWeightClass = 700 if is_bold else 400
                  out_font['OS/2'].ulCodePageRange1 |= 0x00020001 # CP932(日本語) ＆ CP1252(ラテン)
                  out_font['OS/2'].ulUnicodeRange1 |= 0x50000000  # CJK 統合漢字 ＆ かな
                  # Panoseデータを等幅テキスト（Monospace）としてGDIに完全認識させる
                  if hasattr(out_font['OS/2'], 'panose'):
                      out_font['OS/2'].panose.bFamilyType = 2 # Text and Display
                      out_font['OS/2'].panose.bSerifStyle = 11 # Normal Sans
                      out_font['OS/2'].panose.bProportion = 9  # Monospaced
                      
              out_font.save(machiko_path)
              out_font.close()

          print("All Machiko fonts generated successfully with safe flat-decomposed geometry.")

      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-and-machiko-fonts
          path: |
            dist/**/*.ttf
            dist_machiko/*.ttf
          if-no-files-found: error
