name: Build Custom Iosevka and Tune Machiko
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      mono_shrink_ratio:
        required: true
        default: "0.92"
      prop_scale_x_ratio:
        required: true
        default: "0.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update && sudo apt-get install -y ttfautohint xxd
          npm install && echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          pip install fonttools
      - id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-v22-${{ hashFiles('private-build-plans.toml') }}
      - run: xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
      - if: steps.cache-iosevka.outputs.cache-hit != 'true'
        run: |
          npm run build -- 'ttf::IosevkaCustom'
          npm run build -- 'ttf::IosevkaProp'
      - name: Create Machiko Fonts
        shell: python
        env:
          MONO_RATIO: ${{ github.event.inputs.mono_shrink_ratio }}
          PROP_RATIO: ${{ github.event.inputs.prop_scale_x_ratio }}
        run: |
          import os, glob
          from fontTools.ttLib import TTFont
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.pens.recordingPen import DecomposingRecordingPen
          # 🛠️ 新しいhmtxテーブルを安全にゼロから再コンパイルするためのクラスを導入
          from fontTools.ttLib.tables._h_m_t_x import table__h_m_t_x
          
          ja_font_path = "ZenMaruGothic-Light.ttf"
          built_files = glob.glob("dist/**/*.ttf", recursive=True)
          os.makedirs("dist_machiko", exist_ok=True)
          MONO_SHRINK_RATIO = float(os.environ.get("MONO_RATIO", 0.92))
          PROP_SCALE_X_RATIO = float(os.environ.get("PROP_RATIO", 0.80))
          
          for ttf_path in built_files:
              if "node_modules" in ttf_path: continue
              filename = os.path.basename(ttf_path)
              if "IosevkaCustom" in filename: base_key, brand_family, is_mono, user_ratio = "IosevkaCustom", "MachikoMono", True, MONO_SHRINK_RATIO
              elif "IosevkaProp" in filename: base_key, brand_family, is_mono, user_ratio = "IosevkaProp", "MachikoProp", False, PROP_SCALE_X_RATIO
              else: continue
              
              is_bold = "Bold" in filename
              style_str = "Bold" if is_bold else "Regular"
              machiko_path = os.path.join("dist_machiko", filename.replace(base_key, brand_family))
              
              out_font = TTFont(ttf_path)
              out_cmap = out_font['cmap'].getBestCmap()
              out_glyf = out_font['glyf']
              out_upem = out_font['head'].unitsPerEm
              
              # 🛠️ コンパイル時の自動リセットバグを物理的に完全消滅させるためのシャドウ辞書
              final_hmtx_metrics = {}
              for k, v in out_font['hmtx'].metrics.items():
                  final_hmtx_metrics[k] = v
              
              ja_font = TTFont(ja_font_path)
              ja_cmap = ja_font['cmap'].getBestCmap()
              ja_hmtx = ja_font['hmtx']
              ja_glyf = ja_font['glyf']
              ja_glyph_set = ja_font.getGlyphSet()
              ja_upem = ja_font['head'].unitsPerEm
              
              out_upem_scale = out_upem / ja_upem
              iosevka_char_width, _ = out_font['hmtx'].metrics.get('A', (500, 0))
              
              if is_mono:
                  target_ja_width = int(iosevka_char_width * 5 / 3)
                  dynamic_scale_x = out_upem_scale * (target_ja_width / 1000.0) * user_ratio
              else:
                  dynamic_scale_x = out_upem_scale * ((iosevka_char_width * 2) / 1000.0) * user_ratio
                  target_ja_width = int(1000 * dynamic_scale_x)
                  
              out_glyph_set = out_font.getGlyphSet()
              new_glyph_order = list(out_font.getGlyphOrder())
              # 2. 日本語全角文字の「物理長体変形」＆「重なり/隙間完全消滅型」マージ
              for code, j_g_name in ja_cmap.items():
                  if code < 0x007F: continue
                  
                  unique_ja_g_name = f"ja_{j_g_name}"
                  if unique_ja_g_name not in new_glyph_order:
                      new_glyph_order.append(unique_ja_g_name)
                      
                  v_w, v_l = ja_hmtx.metrics[j_g_name]
                  orig_glyph = ja_glyf[j_g_name]
                  
                  if orig_glyph.numberOfContours == 0 or not hasattr(orig_glyph, 'xMin'):
                      final_hmtx_metrics[unique_ja_g_name] = (target_ja_width if is_mono else int(v_w * dynamic_scale_x), 0)
                      out_glyf[unique_ja_g_name] = orig_glyph
                      for table in out_font['cmap'].tables: table.cmap[code] = unique_ja_g_name
                      continue
                      
                  orig_x_min, orig_x_max = orig_glyph.xMin, orig_glyph.xMax
                  orig_content_width = orig_x_max - orig_x_min
                  if orig_content_width <= 0: orig_content_width, orig_x_min = v_w, 0
                  
                  center_x = (orig_x_min + orig_x_max) / 2
                  calc_width = target_ja_width if is_mono else int(v_w * dynamic_scale_x)
                  
                  offset_x = (calc_width / 2) - (center_x * dynamic_scale_x)
                  target_lsb = int(orig_x_min * dynamic_scale_x + offset_x)
                  
                  rec_pen = DecomposingRecordingPen(ja_glyph_set)
                  ja_glyph_set[j_g_name].draw(rec_pen)
                  t_pen = TTGlyphPen(out_font.getGlyphSet())
                  trans_pen = TransformPen(t_pen, (dynamic_scale_x, 0.0, 0.0, out_upem_scale, offset_x, 0.0))
                  rec_pen.replay(trans_pen)
                  
                  out_glyf[unique_ja_g_name] = t_pen.glyph()
                  final_hmtx_metrics[unique_ja_g_name] = (calc_width, target_lsb)
                  for table in out_font['cmap'].tables: table.cmap[code] = unique_ja_g_name

              # 登録簿の更新をマスターに確定適用
              out_font.setGlyphOrder(new_glyph_order)

              # 🛠️ 【超重要・最核心】古いhmtxオブジェクトを完全に破棄し、
              # すべての日本語文字が完全に網羅された、新品のhmtxテーブルをゼロからビルドして強制換装
              new_hmtx = table__h_m_t_x()
              new_hmtx.metrics = final_hmtx_metrics
              out_font['hmtx'] = new_hmtx

              # 日本語ソース（ja_font）の回収クリーンアップ
              ja_font.close()
              
              # メタデータおよびセキュアなネーミングテーブル処理
              full_name = f"{brand_family} {style_str}"
              postscript_name = f"{brand_family}-{style_str}"
              uniq_id = f"1.000;UKWN;{postscript_name}"
              
              out_font['name'].names = []
              name_data = {1: brand_family, 2: style_str, 3: uniq_id, 4: full_name, 6: postscript_name}
              for nid, text_val in name_data.items():
                  out_font['name'].setName(text_val, nid, 3, 1, 0x0411)
                  out_font['name'].setName(text_val, nid, 3, 1, 0x0409)
                  out_font['name'].setName(text_val, nid, 1, 0, 0)
                  
              if 'OS/2' in out_font:
                  out_font['OS/2'].usWeightClass = 700 if is_bold else 400
                  out_font['OS/2'].ulCodePageRange1 |= 0x00020001
                  out_font['OS/2'].ulUnicodeRange1 |= 0x50000000
                  if hasattr(out_font['OS/2'], 'panose'):
                      out_font['OS/2'].panose.bFamilyType = 2
                      out_font['OS/2'].panose.bSerifStyle = 11
                      out_font['OS/2'].panose.bProportion = 3 if is_mono else 0
                  
                  # 全グリフのリアルな幅から平均文字幅（xAvgCharWidth）を再注入
                  valid_widths = [w for w, _ in final_hmtx_metrics.values() if w > 0]
                  if valid_widths:
                      out_font['OS/2'].xAvgCharWidth = int(sum(valid_widths) / len(valid_widths))
                      
              if 'post' in out_font: 
                  out_font['post'].isFixedPitch = 1 if is_mono else 0
                  
              if is_mono and 'hhea' in out_font: 
                  out_font['hhea'].advanceWidthMax = target_ja_width
                  
              out_font.save(machiko_path)
              out_font.close()
              print(f"Generated: {machiko_path}")
              
      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-and-machiko-fonts
          path: |
            dist/**/*.ttf
            dist_machiko/*.ttf
          if-no-files-found: error
