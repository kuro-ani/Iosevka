name: Build Custom Iosevka and Tune Machiko
on:
  workflow_dispatch:
    inputs:
      mono_shrink_ratio:
        description: "Mono: Japanese Glyph Shrink Ratio (e.g., 0.92)"
        required: true
        default: "0.92"
      prop_scale_x_ratio:
        description: "Prop: Japanese Scale X Ratio (e.g., 0.80)"
        required: true
        default: "0.80"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint xxd
          npm install
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
          pip install fonttools

      - name: Cache Iosevka Build Outputs
        id: cache-iosevka
        uses: actions/cache@v4
        with:
          path: dist/
          key: iosevka-base-dist-v3-${{ hashFiles('private-build-plans.toml', 'private-build-plans-prop.toml') }}

      - name: Restore Zen Maru Gothic from Local Hex Text
        run: |
          xxd -r -p zen_hex.txt > ./ZenMaruGothic-Light.ttf
          echo "Successfully restored base font from hex text safely."

      - name: Build Base Font
        if: steps.cache-iosevka.outputs.cache-hit != 'true'
        run: |
          cp private-build-plans.toml private-build-plans.toml.bak
          npm run build -- 'ttf::IosevkaCustom'
          cp private-build-plans-prop.toml private-build-plans.toml
          npm run build -- 'ttf::IosevkaProp'
          mv private-build-plans.toml.bak private-build-plans.toml

      - name: Create Machiko Fonts (Merge and Process Mono/Prop)
        shell: python
        env:
          MONO_RATIO: ${{ github.event.inputs.mono_shrink_ratio }}
          PROP_RATIO: ${{ github.event.inputs.prop_scale_x_ratio }}
        run: |
          import os, glob
          from fontTools.ttLib import TTFont
          from fontTools.ttLib.tables._n_a_m_e import NameRecord
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.pens.recordingPen import DecomposingRecordingPen
          ja_font_path = "ZenMaruGothic-Light.ttf"
          if not os.path.exists(ja_font_path): raise FileNotFoundError()
          built_files = glob.glob("dist/**/*.ttf", recursive=True)
          if not built_files: raise FileNotFoundError()
          os.makedirs("dist_machiko", exist_ok=True)
          sample_font = TTFont(built_files[0])
          base_upem = sample_font['head'].unitsPerEm
          iosevka_half_width, _ = sample_font['hmtx'].metrics.get('A', (500, 0))
          target_ja_width = int(iosevka_half_width * 5 / 3)
          sample_font.close()
          MONO_SHRINK_RATIO = float(os.environ.get("MONO_RATIO", 0.92))
          PROP_SCALE_X_RATIO = float(os.environ.get("PROP_RATIO", 0.80))
          for ttf_path in built_files:
              if "node_modules" in ttf_path: continue
              filename = os.path.basename(ttf_path)
              if "IosevkaCustom" in filename:
                  mode = {"suffix": "Mono", "is_mono": True, "ratio": MONO_SHRINK_RATIO}
                  base_key = "IosevkaCustom"
              elif "IosevkaProp" in filename:
                  mode = {"suffix": "Prop", "is_mono": False, "ratio": PROP_SCALE_X_RATIO}
                  base_key = "IosevkaProp"
              else: continue
              brand_family = f"Machiko{mode['suffix']}"
              machiko_path = os.path.join("dist_machiko", filename.replace(base_key, brand_family))
              out_font = TTFont(ja_font_path)
              out_cmap = out_font['cmap'].getBestCmap()
              out_hmtx = out_font['hmtx'].metrics
              out_glyf = out_font['glyf']
              out_upem = out_font['head'].unitsPerEm
              v_font = TTFont(ttf_path)
              v_cmap = v_font['cmap'].getBestCmap()
              v_hmtx = v_font['hmtx'].metrics
              v_glyph_set = v_font.getGlyphSet()
              em_scale = out_upem / base_upem
              for code, g_name in list(out_cmap.items()):
                  if code < 0x7F: continue
                  orig_glyph = out_glyf[g_name]
                  orig_width, _ = out_hmtx[g_name]
                  if orig_glyph.numberOfContours == 0:
                      out_hmtx[g_name] = (target_ja_width if mode['is_mono'] else int(orig_width * mode['ratio']), 0)
                      continue
                  orig_x_min, orig_x_max = orig_glyph.xMin, orig_glyph.xMax
                  orig_content_width = orig_x_max - orig_x_min
                  if orig_content_width <= 0:
                      orig_content_width = orig_width
                      orig_x_min = 0
                  if mode['is_mono']:
                      ideal_content_width = target_ja_width * mode['ratio']
                      scale_x = ideal_content_width / orig_content_width
                      calc_width = target_ja_width
                  else:
                      scale_x = mode['ratio']
                      ideal_content_width = orig_content_width * mode['ratio']
                      calc_width = int(orig_width * mode['ratio'])
                  target_lsb = (calc_width - ideal_content_width) / 2
                  offset_x = target_lsb - (orig_x_min * scale_x)
                  if orig_glyph.isComposite():
                      for comp in orig_glyph.components: comp.x = int(comp.x * scale_x + offset_x)
                  else:
                      for i in range(len(orig_glyph.coordinates)):
                          x, y = orig_glyph.coordinates[i]
                          orig_glyph.coordinates[i] = (int(x * scale_x + offset_x), y)
                  out_hmtx[g_name] = (calc_width, int(target_lsb))
              out_glyph_set = out_font.getGlyphSet()
              for code, v_g_name in v_cmap.items():
                  if 0x0020 <= code <= 0x007E:
                      ja_g_name = out_cmap.get(code)
                      if not ja_g_name: continue
                      v_width, v_lsb = v_hmtx[v_g_name]
                      rec_pen = DecomposingRecordingPen(v_glyph_set)
                      v_glyph_set[v_g_name].draw(rec_pen)
                      t_pen = TTGlyphPen(out_glyph_set)
                      trans_pen = TransformPen(t_pen, (em_scale, 0.0, 0.0, em_scale, 0.0, 0.0))
                      rec_pen.replay(trans_pen)
                      out_glyf[ja_g_name] = t_pen.glyph()
                      out_hmtx[ja_g_name] = (int(v_width * em_scale), int(v_lsb * em_scale))
              v_font.close()
              is_bold = "Bold" in filename
              style_str = "Bold" if is_bold else "Regular"
              full_name = f"{brand_family} {style_str}"
              postscript_name = f"{brand_family}-{style_str}"
              out_font['name'].names = []
              name_configs = [
                  (0x0409, brand_family, style_str, full_name, postscript_name),
                  (0x0411, brand_family, style_str, full_name, postscript_name)
              ]
              for lang_id, fam, styl, f_nm, ps_nm in name_configs:
                  name_data = {1: fam, 2: styl, 3: f"1.000;UKWN;{ps_nm}", 4: f_nm, 6: ps_nm}
                  for name_id, text_val in name_data.items():
                      nr = NameRecord()
                      nr.platformID, nr.platEncID, nr.langID, nr.nameID = 3, 1, lang_id, name_id
                      nr.string = text_val.encode('utf-16-be')
                      out_font['name'].names.append(nr)
              if 'OS/2' in out_font:
                  out_font['OS/2'].usWeightClass = 700 if is_bold else 400
                  out_font['OS/2'].ulCodePageRange1 |= 0x00020001
                  out_font['OS/2'].ulUnicodeRange1 |= 0x50000000
                  if hasattr(out_font['OS/2'], 'panose'):
                      out_font['OS/2'].panose.bFamilyType = 2
                      out_font['OS/2'].panose.bSerifStyle = 11
                      out_font['OS/2'].panose.bProportion = 3 if mode['is_mono'] else 0
              if 'post' in out_font:
                  out_font['post'].isFixedPitch = 1 if mode['is_mono'] else 0
              if mode['is_mono'] and 'hhea' in out_font:
                  out_font['hhea'].advanceWidthMax = int(target_ja_width)
              out_font.save(machiko_path)
              out_font.close()
              print(f"Successfully generated: {machiko_path}")
          print("All Machiko fonts generated successfully.")

      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-and-machiko-fonts
          path: |
            dist/**/*.ttf
            dist_machiko/*.ttf
          if-no-files-found: error
